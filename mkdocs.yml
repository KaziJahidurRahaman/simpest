site_name: simpest
site_description: Simpest
site_author: KaziJahidurRahaman
site_url: https://KaziJahidurRahaman.github.io/simpest
repo_url: https://github.com/KaziJahidurRahaman/simpest

copyright: "Copyright &copy; 2024 - 2026 Kazi Jahidur Rahaman"

theme:
    palette:
        - scheme: default
          #   primary: blue
          #   accent: indigo
          toggle:
              icon: material/toggle-switch-off-outline
              name: Switch to dark mode
        - scheme: slate
          primary: indigo
          accent: indigo
          toggle:
              icon: material/toggle-switch
              name: Switch to light mode
    name: material
    icon:
        repo: fontawesome/brands/github
    # logo: assets/logo.png
    # favicon: assets/favicon.png
    features:
        - navigation.instant
        - navigation.tracking
        - navigation.top
        - search.highlight
        - search.share
    custom_dir: "docs/overrides"
    font:
        text: Google Sans
        code: Regular

plugins:
    - search
    - mkdocstrings:
          handlers:
              python:
                  options:
                      docstring_style: google
                      docstring_section_style: table
                      show_root_heading: true
                      show_source: true
                      separate_signature: true
                      merge_init_into_class: true
    - git-revision-date
    - git-revision-date-localized:
          enable_creation_date: true
          type: timeago
    # - pdf-export
    - mkdocs-jupyter:
          include_source: True
          ignore_h1_titles: True
          execute: False
          allow_errors: false
          ignore:
              - "conf.py"
              # Backup copy kept for local reference; not part of the published
              # documentation set.
              - "examples/Run Simpest - Copy.ipynb"
          execute_ignore: ["*ignore.ipynb"]

markdown_extensions:
    - admonition
    - abbr
    - attr_list
    - def_list
    - footnotes
    - meta
    - md_in_html
    - pymdownx.arithmatex:
          generic: true
    - pymdownx.superfences
    - pymdownx.highlight:
          linenums: true
    - toc:
          permalink: true

extra_javascript:
    - javascripts/mathjax.js
    - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# extra:
#     analytics:
#         provider: google
#         property: UA-XXXXXXXXX-X

nav:
    - Home: index.md
    - Installation: installation.md
    - Usage: usage.md
    - Contributing: contributing.md
    - FAQ: faq.md
    - Changelog: changelog.md
    - Report Issues: https://github.com/KaziJahidurRahaman/simpest/issues
    - Examples:
        - Run simpest: examples/1_Run Simpest.ipynb
        - Plot results: examples/2_Plot.ipynb
    - API Reference:
          - simpest module: simpest.md
          - common module: common.md
          - models:
              - models package: models/models_package.md
              - simplace module: models/simplace.md
              - franchestyn module: models/franchestyn.md
              - fr_crop module: models/fr_crop_model.md
              - fr_disease module: models/fr_disease_model.md
              - fr_fungicide module: models/fr_fungicide_model.md
              - fr_optimizer module: models/fr_optimizer.md
              - fr_runner module: models/fr_runner.md
              - fr_data module: models/fr_data.md
              - fr_utilities module: models/fr_utilities.md
              - fr_param_reader module: models/fr_param_reader.md
              - fr_reference_reader module: models/fr_reference_reader.md
              - fr_weather_reader module: models/fr_weather_reader.md
